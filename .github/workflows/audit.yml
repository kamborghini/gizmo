# Dependencies are pinned exactly, which keeps deploys reproducible but means a
# security fix only arrives when somebody looks. This looks, every Monday.
# Note the bare pip-audit: `-r requirements.txt` scans only the packages we name,
# and the worst findings so far were in the ones those pull in.
name: audit

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      # The lock is installed on its own: hash-checking applies to the whole
      # command, and pip-audit is not in the lock.
      - run: pip install --require-hashes -r requirements.txt
      - run: pip install pip-audit==2.10.1
      - name: Python dependencies (whole installed environment)
        run: pip-audit --progress-spinner off
      - name: The forecast service's dependencies (checked as locked)
        run: pip-audit --progress-spinner off -r forecast/requirements-service.txt
      - name: JavaScript dependencies
        run: npm audit --omit=dev
