# Runs the dispatch suite on every push. Until this existed, the only thing
# between a broken change and production was somebody remembering to run the
# tests by hand, and the money paths (booking, charging, fulfilment) are in here.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The default GITHUB_TOKEN scope is whatever the org happens to set. These jobs
# only ever read the repo, so they say so: a compromised step in a third-party
# action cannot then write code, releases or packages with the job's own token.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'      # matches the Dockerfile
          cache: pip
      - run: pip install -r requirements.txt
      - name: Dispatch suite
        run: python tests/test_dispatch.py
      - name: Frontend regressions
        run: python tests/test_frontend.py
      - name: No em or en dashes in UI copy
        run: |
          if grep -q '—\|–' static/index.html; then
            echo "UI copy contains an em or en dash"; exit 1
          fi
      # Dependency scanning belongs on the PR, not only on Monday. The weekly
      # audit workflow still runs - that one catches advisories published after
      # a merge, which no per-PR scan can. This one stops a known-vulnerable
      # pin reaching main in the first place, where it auto-deploys.
      - name: Dependency audit (blocking)
        run: |
          pip install pip-audit
          pip-audit --progress-spinner off
      - name: The AI tool registry stays read-only
        run: |
          python - <<'PY'
          import server
          bad = [n for n in server.COPILOT_TOOLS
                 if any(w in n for w in ("create", "update", "set_", "delete", "write"))]
          assert not bad, f"write-capable tool reachable by the AI: {bad}"
          print(f"{len(server.COPILOT_TOOLS)} tools, all reads")
          PY
