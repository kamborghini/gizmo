# Runs the dispatch suite on every push. Until this existed, the only thing
# between a broken change and production was somebody remembering to run the
# tests by hand, and the money paths (booking, charging, fulfilment) are in here.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The default GITHUB_TOKEN scope is whatever the org happens to set. These jobs
# only ever read the repo, so they say so: a compromised step in a third-party
# action cannot then write code, releases or packages with the job's own token.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'      # matches the Dockerfile
          cache: pip
      # The frontend suite runs the page's code in node: a chosen version, not
      # whatever the runner image happens to carry.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pip install --require-hashes -r requirements.txt
      - name: Dispatch suite
        run: python tests/test_dispatch.py
      - name: Frontend regressions
        run: python tests/test_frontend.py
      - name: JavaScript dependency audit (blocking; the print extensions' lockfile)
        run: npm audit --omit=dev
      # esbuild does not type-check and neither does the Shopify CLI, so a prop
      # or API Shopify renames in a new version would otherwise surface only in
      # the admin, after a deploy.
      - name: The Shopify extensions build and type-check
        run: |
          npm ci --no-audit --no-fund
          python tools/ext_check.py --require
      - name: No em or en dashes in UI copy
        run: |
          if grep -rqE '—|–|\\u201[34]|&[mn]dash;' static/src static/composer.js; then
            echo "UI copy contains an em or en dash"; exit 1
          fi
      # Dependency scanning belongs on the PR, not only on Monday. The weekly
      # audit workflow still runs - that one catches advisories published after
      # a merge, which no per-PR scan can. This one stops a known-vulnerable
      # pin reaching main in the first place, where it auto-deploys.
      - name: Dependency audit (blocking)
        run: |
          pip install pip-audit==2.10.1
          pip-audit --progress-spinner off
      - name: SBOM (CycloneDX, kept with the run)
        run: pip-audit --progress-spinner off --format cyclonedx-json --output sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
      - name: SAST (bandit, high severity and high confidence, blocking)
        run: |
          pip install bandit==1.9.4
          bandit -q -lll -iii -r copilot.py pagesource.py server.py google_mail.py worldoptions.py mailmime.py eori.py tokenvault.py logdrain.py totp.py pipedrive.py perf.py gizmo
      - name: No credentials or invisible characters in the tree
        run: python tools/sweep_tree.py
      - name: The environment reference is current
        run: python tools/env_reference.py --check
      - name: The API route reference is current
        run: python tools/route_reference.py --check
      - name: The AI tool registry stays read-only
        run: |
          python - <<'PY'
          import server
          bad = [n for n in server.COPILOT_TOOLS
                 if any(w in n for w in ("create", "update", "set_", "delete", "write"))]
          assert not bad, f"write-capable tool reachable by the AI: {bad}"
          print(f"{len(server.COPILOT_TOOLS)} tools, all reads")
          PY

  # Every screen in Chromium, at three sizes, in an invented world (tests/browser).
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The forecast's seeded run is produced by the forecast package itself.
      - run: pip install --require-hashes -r requirements.txt
      - run: pip install --require-hashes -r forecast/requirements-service.txt
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: The browser suite's own units
        run: node --test 'tests/browser/unit/*.test.js'
      - name: The seeded world, without a browser
        run: python tests/browser/test_world.py
      - name: Every screen in a real browser
        run: npx playwright test -c tests/browser/playwright.config.js
        env:
          CI: '1'
          PY: python
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-run
          path: tests/browser/.run/
          retention-days: 14

  # The forecast package has its own dependencies (the nightly service's
  # image), which the app never imports, so it gets its own job: installed
  # beside the app, they would be scanned and listed in the app's SBOM above
  # as if the app shipped them. Without pandas the suite skips itself and
  # passes, which is why this job installs them rather than relying on it.
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: forecast/requirements-prophet.txt
      # The service's lock plus Prophet, which the image does not carry, so
      # its two methods are tested here before anyone switches them on.
      - run: pip install --require-hashes -r forecast/requirements-prophet.txt
      - name: Forecast suite
        run: |
          python -c "import pandas, prophet"   # fail loudly rather than let the suite (or its Prophet checks) skip
          python tests/test_forecast.py
      - name: Forecast dependency audit (blocking)
        run: |
          pip install pip-audit==2.10.1
          pip-audit --progress-spinner off -r forecast/requirements-service.txt

  # CI's audits above scan the runner's Python, not what ships: the images
  # carry their own pip and Debian packages. This builds both exactly as the
  # host does and audits what is inside each.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the app image and audit what it installs
        run: |
          docker build -t reactor-app .
          docker run --rm --entrypoint sh reactor-app -c 'python --version && pip --version && pip install --quiet --no-cache-dir pip-audit==2.10.1 && pip-audit --progress-spinner off'
      - name: Build the forecast image and audit what it installs
        run: |
          docker build -f forecast/Dockerfile -t reactor-forecast .
          docker run --rm --entrypoint sh reactor-forecast -c 'python --version && pip --version && python -c "import pandas, statsmodels, statsforecast" && pip install --quiet --no-cache-dir pip-audit==2.10.1 && pip-audit --progress-spinner off'
      - name: The app image starts and answers
        run: |
          docker run -d --name app -p 8000:8000 -e PORT=8000 reactor-app
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/healthz > /dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:8000/healthz > /dev/null || { docker logs app; exit 1; }
          # The page is joined from static/src at start-up: an image without
          # its sections answers /healthz and nothing else, so fetch the page
          # and the script it names as well.
          page=$(curl -sf http://127.0.0.1:8000/) || { echo "the page did not load"; docker logs app; exit 1; }
          js=$(printf '%s' "$page" | grep -o '/assets/app\.js?v=[0-9a-f]*' | head -1)
          [ -n "$js" ] && curl -sf "http://127.0.0.1:8000$js" > /dev/null || { echo "the page's script did not load"; docker logs app; exit 1; }
